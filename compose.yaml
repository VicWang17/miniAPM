services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./deploy/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse-data:/var/lib/clickhouse
  mysql:
    image: mysql:9.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: miniapm
    ports:
      - "3307:3306"
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql

volumes:
  prometheus-data:
  grafana-data:
  clickhouse-data:
  mysql-data:
