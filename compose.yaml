services:
  hive:
    image: apache/hive:4.0.1
    user: root
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_CLIENT_OPTS: "-Xmx2G"
      HADOOP_CONF_DIR: /etc/miniapm/hadoop
      HIVE_CONF_DIR: /etc/miniapm/hive
    entrypoint:
      - bash
      - -lc
    command:
      - |
        mkdir -p /data/namenode /data/datanode /data/metastore
        if [ ! -d /data/namenode/current ]; then /opt/hadoop/bin/hdfs namenode -format -force; fi
        /opt/hadoop/bin/hdfs --daemon start namenode
        /opt/hadoop/bin/hdfs --daemon start datanode
        /opt/hive/bin/schematool -dbType derby -initSchema || /opt/hive/bin/schematool -dbType derby -info
        exec /opt/hive/bin/hive --service hiveserver2
    ports:
      - "10000:10000"
      - "9870:9870"
    volumes:
      - ./deploy/hive/hadoop:/etc/miniapm/hadoop:ro
      - ./deploy/hive/hive-site.xml:/etc/miniapm/hive/hive-site.xml:ro
      - hive-data:/data
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/miniapm-rules.yml:/etc/prometheus/miniapm-rules.yml:ro
      - ./deploy/prometheus/miniapm-slo-rules.yml:/etc/prometheus/miniapm-slo-rules.yml:ro
      - ./deploy/prometheus/miniapm-slo-rules-test.yml:/etc/prometheus/miniapm-slo-rules-test.yml:ro
      - ./deploy/prometheus/p13-noise-test-rules.yml:/etc/prometheus/p13-noise-test-rules.yml:ro
      - ./deploy/prometheus/p13-noise-rule-tests.yml:/etc/prometheus/p13-noise-rule-tests.yml:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./deploy/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse-data:/var/lib/clickhouse
  mysql:
    image: mysql:9.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: miniapm
    ports:
      - "3307:3306"
    volumes:
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
  instrumented-order:
    build:
      context: .
      dockerfile: deploy/instrumented/Dockerfile
    environment:
      SERVICE_NAME: order
      INSTANCE: order-linux-1
      VERSION: v1
      DATASET_ID: 018f2f70-0000-7000-8000-000000000801
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      INVENTORY_URL: http://instrumented-inventory:8080
    ports:
      - "8080:8080"
  instrumented-inventory:
    cpus: 0.5
    build:
      context: .
      dockerfile: deploy/instrumented/Dockerfile
    environment:
      SERVICE_NAME: inventory
      INSTANCE: inventory-linux-1
      VERSION: v1
      DATASET_ID: 018f2f70-0000-7000-8000-000000000801
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "8081:8080"
  redis:
    image: redis:7.4.1
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: miniapm
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management load_definitions \"/etc/rabbitmq/definitions.json\""
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  hive-data:
  alertmanager-data:
  prometheus-data:
  grafana-data:
  clickhouse-data:
  mysql-data:
  rabbitmq-data:
