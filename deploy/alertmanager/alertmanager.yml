route:
  receiver: miniapm-webhook
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
  routes:
    - matchers: [policy="experiment"]
      receiver: miniapm-experiment-log
receivers:
  - name: miniapm-webhook
    webhook_configs:
      - url: http://host.docker.internal:8000/api/v1/alerts/webhook
        send_resolved: true
  - name: miniapm-experiment-log
    webhook_configs:
      - url: http://host.docker.internal:8000/api/v1/alerts/experiments
        send_resolved: true
