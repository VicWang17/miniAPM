global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/miniapm-rules.yml
  - /etc/prometheus/miniapm-slo-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: miniapm-simulator
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:8766
    relabel_configs:
      - source_labels: [__address__]
        target_label: scrape_target
  - job_name: miniapm-instrumented
    honor_labels: true
    static_configs:
      - targets:
          - instrumented-order:8080
          - instrumented-inventory:8080
  - job_name: miniapm-adapted
    honor_labels: true
    metrics_path: /metrics/heterogeneous
    static_configs:
      - targets: [host.docker.internal:8000]
  - job_name: miniapm-rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: miniapm-consumer
    static_configs:
      - targets:
          - host.docker.internal:8767
          - host.docker.internal:8768
          - host.docker.internal:8769
          - host.docker.internal:8770
