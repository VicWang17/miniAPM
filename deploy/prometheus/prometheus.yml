global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: miniapm-simulator
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:8766
    relabel_configs:
      - source_labels: [__address__]
        target_label: scrape_target
  - job_name: miniapm-rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: miniapm-consumer
    static_configs:
      - targets:
          - host.docker.internal:8767
          - host.docker.internal:8768
          - host.docker.internal:8769
          - host.docker.internal:8770
