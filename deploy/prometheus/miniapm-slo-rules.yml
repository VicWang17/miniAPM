# Generated by scripts/generate_slo_rules.py; edit slo-config.json instead.
groups:
  - name: miniapm-slo-experiments
    interval: 15s
    rules:
      - record: miniapm:order_error_burn_rate:1h
        expr: sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",status="error"}[1h])) / sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated"}[1h])) / 0.010000000000000009
        labels:
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          window: "1h"
      - record: miniapm:order_error_burn_rate:5m
        expr: sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",status="error"}[5m])) / sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated"}[5m])) / 0.010000000000000009
        labels:
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          window: "5m"
      - record: miniapm:order_error_burn_rate:6h
        expr: sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",status="error"}[6h])) / sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated"}[6h])) / 0.010000000000000009
        labels:
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          window: "6h"
      - record: miniapm:order_error_burn_rate:30m
        expr: sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",status="error"}[30m])) / sum(rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated"}[30m])) / 0.010000000000000009
        labels:
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          window: "30m"
      - alert: MiniapmAvailabilityFastBurn
        expr: (miniapm:order_error_burn_rate:1h > 14.4) and on (dataset_id, service) (miniapm:order_error_burn_rate:5m > 14.4) and on (dataset_id, service) (sum by (dataset_id, service) (rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated"}[5m])) > 0.1)
        for: 1m
        labels:
          policy: "experiment"
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          strategy: "fast_burn"
        annotations:
          summary: "SLO fast_burn for order POST /orders"
      - alert: MiniapmAvailabilitySlowBurn
        expr: (miniapm:order_error_burn_rate:6h > 6.0) and on (dataset_id, service) (miniapm:order_error_burn_rate:30m > 6.0) and on (dataset_id, service) (sum by (dataset_id, service) (rate(miniapm_requests_total{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated"}[30m])) > 0.1)
        for: 1m
        labels:
          policy: "experiment"
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          strategy: "slow_burn"
        annotations:
          summary: "SLO slow_burn for order POST /orders"
      - alert: MiniapmInFlightSigma
        expr: miniapm_requests_in_flight{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",instance="order-1",version="v1"} > (avg_over_time(miniapm_requests_in_flight{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",instance="order-1",version="v1"}[1h] offset 1h) + 3 * stddev_over_time(miniapm_requests_in_flight{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",instance="order-1",version="v1"}[1h] offset 1h))
        for: 1m
        labels:
          policy: "experiment"
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          strategy: "gauge_3sigma"
        annotations:
          summary: "In-flight requests exceed historical mean plus 3 sigma"
      - alert: MiniapmInFlightFixed
        expr: miniapm_requests_in_flight{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",instance="order-1",version="v1"} > 5
        for: 1m
        labels:
          policy: "experiment"
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          strategy: "gauge_fixed"
        annotations:
          summary: "In-flight requests exceed fixed threshold"
      - alert: MiniapmLatencySLO
        expr: (1 - sum(rate(miniapm_request_duration_seconds_bucket{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",le="0.5"}[5m])) / sum(rate(miniapm_request_duration_seconds_bucket{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",le="+Inf"}[5m])) > 0.01) and (sum(rate(miniapm_request_duration_seconds_bucket{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",le="+Inf"}[5m])) > 0.1)
        for: 1m
        labels:
          policy: "experiment"
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          strategy: "latency_slo"
        annotations:
          summary: "More than 1 percent of requests exceed 0.5 seconds"
      - alert: MiniapmLatencyP95Comparison
        expr: (histogram_quantile(0.95, sum by (le) (rate(miniapm_request_duration_seconds_bucket{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated"}[5m]))) > 0.5) and (sum(rate(miniapm_request_duration_seconds_bucket{dataset_id="018f2f70-0000-7000-8000-000000000606",environment="local",service="order",route="POST /orders",source_kind="simulated",le="+Inf"}[5m])) > 0.1)
        for: 1m
        labels:
          policy: "experiment"
          dataset_id: "018f2f70-0000-7000-8000-000000000606"
          service: "order"
          strategy: "p95_fixed"
        annotations:
          summary: "P95 exceeds 0.5 seconds for comparison"
